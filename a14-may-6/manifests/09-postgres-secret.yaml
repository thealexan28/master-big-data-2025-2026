# Secret con la contraseña de Postgres.
# stringData: lo escribimos en claro y Kubernetes lo codifica a base64 al guardarlo.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credenciales
  namespace: clase14
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: clase14-postgres
  POSTGRES_DB: clase14
