# Secret: igual que ConfigMap pero para datos sensibles (passwords, tokens, claves).
# Por defecto se almacena en base64 (NO es cifrado, solo codificacion).
# En produccion: integrar con un KMS o usar Sealed Secrets / External Secrets.
# Aqui usamos stringData para no tener que codificar a mano (Kubernetes lo hace por nosotros).
apiVersion: v1
kind: Secret
metadata:
  name: minio-credenciales
  namespace: clase14
type: Opaque
stringData:
  MINIO_ROOT_USER: admin
  MINIO_ROOT_PASSWORD: clase14-minio
