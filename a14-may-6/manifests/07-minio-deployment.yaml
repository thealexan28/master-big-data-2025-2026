# Deployment de MinIO con 1 replica.
# Importante: MinIO single-node NO se debe escalar a >1 replica con un PVC ReadWriteOnce
# (cada replica necesitaria su propio almacenamiento). Para varias replicas reales,
# MinIO se despliega en modo distributed, normalmente con StatefulSet.
# Aqui mantenemos 1 replica para enseñar el patron Secret + PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: clase14
spec:
  replicas: 1
  strategy:
    type: Recreate  # con PVC ReadWriteOnce no podemos hacer rolling update
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          # Variables de entorno cargadas desde el Secret.
          envFrom:
            - secretRef:
                name: minio-credenciales
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
